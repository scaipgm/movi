<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Gestión Integral</title>
    <style>
        :root {
            --bg-body: #edf2f7;
            --bg-card: #ffffff;
            --text-main: #1a202c;
            --text-label: #4a5568;
            --text-muted: #718096;
            --border-color: #cbd5e0;
            --tab-inactive: #cbd5e0;
            --tab-inactive-text: #2d3748;
            --box-bg: #f8fafc;
            --item-bg: #ffffff;
            --primary: #2b6cb0;
            --primary-hover: #2c5282;
            --shadow: rgba(0,0,0,0.08);
        }

        body.dark-mode {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-label: #cbd5e1;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --tab-inactive: #334155;
            --tab-inactive-text: #94a3b8;
            --box-bg: #0f172a;
            --item-bg: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #1d4ed8;
            --shadow: rgba(0,0,0,0.4);
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg-body); 
            color: var(--text-main);
            margin: 0; 
            padding: 12px; 
            transition: background 0.2s ease, color 0.2s ease;
        }

        .container { max-width: 650px; margin: 10px auto; position: relative; }

        /* Barra superior con botón de Modo Oscuro */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 8px;
        }

        .btn-theme {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 5px var(--shadow);
            width: auto;
            margin: 0;
        }

        .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 8px; }
        .tab-btn { 
            padding: 10px 4px; 
            border: none; 
            background: var(--tab-inactive); 
            color: var(--tab-inactive-text); 
            font-weight: bold; 
            font-size: 13px; 
            border-radius: 6px 6px 0 0; 
            cursor: pointer; 
            text-align: center; 
        }
        .tab-btn.active { 
            background: var(--bg-card); 
            color: var(--primary); 
            border-top: 3px solid var(--primary); 
        }

        .card { 
            background: var(--bg-card); 
            padding: 22px; 
            border-radius: 0 0 10px 10px; 
            box-shadow: 0 4px 15px var(--shadow); 
        }

        h2 { margin-top: 0; color: var(--text-main); font-size: 19px; text-align: center; }
        label { display: block; margin-top: 14px; font-weight: 600; color: var(--text-label); font-size: 13px; }

        input, select, button { 
            width: 100%; 
            padding: 11px; 
            margin-top: 5px; 
            border-radius: 6px; 
            border: 1px solid var(--border-color); 
            background: var(--bg-card);
            color: var(--text-main);
            box-sizing: border-box; 
            font-size: 15px; 
        }

        .btn-submit { 
            background: var(--primary); 
            color: white; 
            border: none; 
            font-weight: bold; 
            margin-top: 18px; 
            cursor: pointer; 
        }
        .btn-submit:hover { background: var(--primary-hover); }

        .btn-sm { padding: 8px 14px; font-size: 12px; font-weight: bold; border-radius: 4px; border: none; cursor: pointer; width: auto; margin: 0; }
        .btn-copy { background: #475569; color: white; }
        .btn-copy:hover { background: #334155; }
        .btn-arca { background: #0d9488; color: white; text-decoration: none; display: inline-block; padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; margin-top: 8px; }
        .btn-arca:hover { background: #0f766e; }

        /* Badges BCRA */
        .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .sit-1 { background: #c6f6d5; color: #22543d; }
        .sit-2 { background: #fefcbf; color: #744210; }
        .sit-3 { background: #feebc8; color: #7b341e; }
        .sit-4 { background: #fed7d7; color: #742a2a; }
        .sit-5 { background: #e2e8f0; color: #1a202c; }

        .counter-badge { float: right; font-size: 13px; color: var(--text-muted); font-weight: bold; }
        .card-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .box-result { margin-top: 15px; padding: 14px; border-radius: 8px; background: var(--box-bg); border: 1px solid var(--border-color); }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <button class="btn-theme" onclick="toggleTheme()" id="theme-toggle">🌙 Modo Oscuro</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="btn-t1" onclick="verTab('tab-cuit')">👤 DNI / BCRA</button>
        <button class="tab-btn" id="btn-t2" onclick="verTab('tab-geo')">📍 Coordenadas</button>
        <button class="tab-btn" id="btn-t3" onclick="verTab('tab-nollame')">🚫 No Llame</button>
        <button class="tab-btn" id="btn-t4" onclick="verTab('tab-tarjeta')">💳 Tarjetas</button>
    </div>

    <!-- 1. DNI / CUIT / BCRA -->
    <div id="tab-cuit" class="card">
        <h2>Consulta DNI / CUIT / Situación BCRA</h2>
        <label>Contraseña de acceso:</label>
        <input type="password" id="password" value="tarde" placeholder="Ingresa contraseña">

        <label>Número de DNI:</label>
        <input type="number" id="dni" placeholder="Ej: 45140633">

        <label>Género a consultar:</label>
        <select id="genero">
            <option value="AMBOS">Consultar ambos (M y F)</option>
            <option value="M">Masculino (Prefijo 20)</option>
            <option value="F">Femenino (Prefijo 27)</option>
        </select>

        <button class="btn-submit" onclick="consultarPersona()">Consultar</button>
        <div id="out-persona"></div>
    </div>

    <!-- 2. GEOLOCALIZADOR / COBERTURA -->
    <div id="tab-geo" class="card" style="display:none;">
        <h2>Buscar Coordenadas para Cobertura</h2>
        <label>Dirección y localidad (o entrecalle):</label>
        <input type="text" id="dir-input" placeholder="Ej: Calle el volcan 2241, Las Heras o El volcan y tunuyan">
        
        <button class="btn-submit" onclick="buscarCoordenadas()">Obtener Coordenadas</button>
        <div id="out-geo"></div>
    </div>

    <!-- 3. REGISTRO NO LLAME (Limpio y directo) -->
    <div id="tab-nollame" class="card" style="display:none; padding: 12px;">
        <div style="width: 100%; height: 500px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); background: white;">
            <iframe id="frame-nollame" src="https://nollame.damatec.com.ar/" style="width: 100%; height: 100%; border: none;"></iframe>
        </div>
    </div>

    <!-- 4. VALIDADOR DE TARJETAS -->
    <div id="tab-tarjeta" class="card" style="display:none;">
        <h2>Validador de Tarjetas (Crédito / Débito)</h2>
        <label>Número de Tarjeta: <span id="contador-digitos" class="counter-badge">0 dígitos</span></label>
        <input type="text" id="num-tarjeta" placeholder="Pega el número aquí" maxlength="23" oninput="analizarTarjeta()">

        <div class="box-result">
            <div class="card-row"><span><strong>Cantidad de Dígitos:</strong></span><span id="card-len">0</span></div>
            <div class="card-row"><span><strong>Red / Franquicia:</strong></span><span id="card-brand" style="font-weight:bold;">-</span></div>
            <div class="card-row"><span><strong>Tipo:</strong></span><span id="card-type">-</span></div>
            <div class="card-row"><span><strong>Banco Emisor:</strong></span><span id="card-bank" style="font-weight:bold; color:var(--primary);">-</span></div>
            <div class="card-row"><span><strong>País:</strong></span><span id="card-country">-</span></div>
            <div class="card-row" style="border-top:1px solid var(--border-color); padding-top:8px;">
                <span><strong>Validación Luhn (Dígito verificador):</strong></span><span id="card-luhn" style="font-weight:bold;">-</span>
            </div>
        </div>
    </div>
</div>

<script>
// Manejo de Modo Oscuro
function toggleTheme() {
    const body = document.body;
    const isDark = body.classList.toggle('dark-mode');
    const btn = document.getElementById('theme-toggle');
    if (isDark) {
        btn.innerHTML = '☀️ Modo Claro';
        localStorage.setItem('theme', 'dark');
    } else {
        btn.innerHTML = '🌙 Modo Oscuro';
        localStorage.setItem('theme', 'light');
    }
}

// Cargar preferencia guardada
if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark-mode');
    document.getElementById('theme-toggle').innerHTML = '☀️ Modo Claro';
}

function verTab(id) {
    ['tab-cuit', 'tab-geo', 'tab-nollame', 'tab-tarjeta'].forEach(t => document.getElementById(t).style.display = 'none');
    ['btn-t1', 'btn-t2', 'btn-t3', 'btn-t4'].forEach(b => document.getElementById(b).classList.remove('active'));
    document.getElementById(id).style.display = 'block';

    if (id === 'tab-cuit') document.getElementById('btn-t1').classList.add('active');
    if (id === 'tab-geo') document.getElementById('btn-t2').classList.add('active');
    if (id === 'tab-nollame') document.getElementById('btn-t3').classList.add('active');
    if (id === 'tab-tarjeta') document.getElementById('btn-t4').classList.add('active');
}

function copiar(t) {
    navigator.clipboard.writeText(t);
    alert('Copiado: ' + t);
}

function getSituacionLabel(sit) {
    switch (parseInt(sit)) {
        case 1: return { texto: 'Situación 1 (Normal / Al día)', clase: 'sit-1' };
        case 2: return { texto: 'Situación 2 (Riesgo Bajo / Mora 31-90 días)', clase: 'sit-2' };
        case 3: return { texto: 'Situación 3 (Riesgo Medio / Mora 91-180 días)', clase: 'sit-3' };
        case 4: return { texto: 'Situación 4 (Alto Riesgo / Mora > 180 días)', clase: 'sit-4' };
        case 5: return { texto: 'Situación 5 (Irrecuperable / Incobrable)', clase: 'sit-5' };
        default: return { texto: `Situación ${sit}`, clase: 'sit-1' };
    }
}

// 1. DNI
async function consultarPersona() {
    const dni = document.getElementById('dni').value.trim();
    const genero = document.getElementById('genero').value;
    const password = document.getElementById('password').value.trim();
    const out = document.getElementById('out-persona');

    if (!dni || !password) return alert('Ingresa la contraseña y el DNI.');
    out.innerHTML = '<p style="text-align:center; color:var(--text-muted); margin-top:15px;">Consultando BCRA...</p>';

    try {
        const res = await fetch('/api/consultar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ dni, genero, password })
        });
        const data = await res.json();
        if (data.error) return out.innerHTML = `<p style="color:#e53e3e; text-align:center;">${data.error}</p>`;

        let html = '';
        data.reportes.forEach(item => {
            html += `<div class="box-result">
                <div style="font-size:12px; font-weight:bold; color:var(--text-muted);">VARIANTE ${item.genero.toUpperCase()}</div>
                <div style="display:flex; justify-content:space-between; align-items:center; background:var(--bg-body); padding:6px 10px; border-radius:6px; margin:6px 0; border:1px solid var(--border-color);">
                    <span style="font-family:monospace; font-size:17px; font-weight:bold;">${item.cuit}</span>
                    <button class="btn-sm btn-copy" onclick="copiar('${item.cuit}')">Copiar CUIT</button>
                </div>
                <div style="margin: 8px 0;"><strong>Nombre / Razón Social:</strong> <span style="color:var(--primary); font-weight:bold;">${item.denominacion || 'No registrado en BCRA'}</span></div>
                <a href="https://seti.afip.gob.ar/padron-puc-constancia-internet/ConsultaConstanciaAction.do" target="_blank" class="btn-arca" onclick="copiar('${item.cuit}')">
                    🏛️ Abrir Constancia ARCA (Copia CUIT)
                </a>
                <div style="margin-top:10px; font-weight:bold;">Situación en BCRA:</div>`;

            if (item.bcra.registros && item.bcra.registros.length > 0) {
                item.bcra.registros.forEach(d => {
                    const sit = getSituacionLabel(d.situacion);
                    html += `<div style="background:var(--item-bg); border:1px solid var(--border-color); padding:8px; border-radius:6px; margin-top:6px;">
                        <div style="font-weight:bold;">${d.entidad}</div>
                        <div style="font-size:13px; margin: 2px 0;">Monto: $${d.monto} mil | Período: ${d.periodo}</div>
                        <div><span class="badge ${sit.clase}">${sit.texto}</span></div>
                    </div>`;
                });
            } else {
                html += `<p style="color:var(--text-muted); font-size:13px; margin:4px 0;">Sin deudas en BCRA.</p>`;
            }
            html += `</div>`;
        });
        out.innerHTML = html;
    } catch (e) {
        out.innerHTML = '<p style="color:#e53e3e; text-align:center;">Error al consultar.</p>';
    }
}

// 2. Coordenadas
async function buscarCoordenadas() {
    const dir = document.getElementById('dir-input').value.trim();
    const out = document.getElementById('out-geo');
    if (!dir) return alert('Ingresa una dirección.');

    out.innerHTML = '<p style="text-align:center; color:var(--text-muted);">Buscando coordenadas satelitales...</p>';

    try {
        const res = await fetch(`/api/geocode?direccion=${encodeURIComponent(dir)}`);
        const data = await res.json();
        if (!data.exito) return out.innerHTML = `<p style="color:#e53e3e; text-align:center;">${data.mensaje}</p>`;

        let html = '';
        data.resultados.forEach((r, idx) => {
            const coords = `${r.lat}, ${r.lon}`;
            html += `<div class="box-result">
                <div style="font-weight:bold; color:var(--text-main);">Opción ${idx + 1}: ${r.nombre}</div>
                <div style="margin:8px 0; font-family:monospace; font-size:16px; color:var(--primary); font-weight:bold;">
                    📍 ${coords}
                </div>
                <div style="display:flex; gap:8px;">
                    <button class="btn-sm btn-copy" onclick="copiar('${coords}')">Copiar Coordenadas</button>
                    <a href="${r.mapsUrl}" target="_blank" style="background:var(--primary); color:white; padding:6px 12px; font-size:12px; text-decoration:none; border-radius:4px; font-weight:bold;">Ver en Maps</a>
                </div>
            </div>`;
        });
        out.innerHTML = html;
    } catch (e) {
        out.innerHTML = '<p style="color:#e53e3e; text-align:center;">Error al buscar coordenadas.</p>';
    }
}

// 3. Tarjetas
function luhnCheck(num) {
    let sum = 0, alt = false;
    for (let i = num.length - 1; i >= 0; i--) {
        let n = parseInt(num[i]);
        if (alt) { n *= 2; if (n > 9) n -= 9; }
        sum += n; alt = !alt;
    }
    return sum % 10 === 0;
}

function identificarMarca(n) {
    if (/^4/.test(n)) return 'VISA';
    if (/^(5[1-5]|2[2-7])/.test(n)) return 'Mastercard';
    if (/^3[47]/.test(n)) return 'American Express';
    if (/^(5896|6042|6043|50)/.test(n)) return 'Cabal / Naranja';
    return 'Desconocida';
}

let timeoutBin;
function analizarTarjeta() {
    const clean = document.getElementById('num-tarjeta').value.replace(/\D/g, '');
    document.getElementById('contador-digitos').innerText = `${clean.length} dígitos`;
    document.getElementById('card-len').innerText = clean.length;

    if (!clean.length) return;
    document.getElementById('card-brand').innerText = identificarMarca(clean);

    if (clean.length >= 13) {
        document.getElementById('card-luhn').innerHTML = luhnCheck(clean) 
            ? '<span style="color:#38a169; font-weight:bold;">✅ VÁLIDA</span>' 
            : '<span style="color:#e53e3e; font-weight:bold;">❌ INVÁLIDA</span>';
    }

    if (clean.length >= 6) {
        clearTimeout(timeoutBin);
        timeoutBin = setTimeout(async () => {
            try {
                const res = await fetch(`/api/bin/${clean.substring(0, 8)}`);
                const d = await res.json();
                if (d.valido) {
                    document.getElementById('card-bank').innerText = d.banco;
                    document.getElementById('card-type').innerText = d.tipo;
                    document.getElementById('card-country').innerText = d.pais;
                }
            } catch (e) {}
        }, 400);
    }
}
</script>

</body>
</html>
