<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Gestión Integral</title>
    <style>
        :root {
            --bg-body: #edf2f7;
            --bg-card: #ffffff;
            --text-main: #1a202c;
            --text-label: #4a5568;
            --text-muted: #718096;
            --border-color: #cbd5e0;
            --tab-inactive: #cbd5e0;
            --tab-inactive-text: #2d3748;
            --box-bg: #f8fafc;
            --item-bg: #ffffff;
            --primary: #2b6cb0;
            --primary-hover: #2c5282;
            --shadow: rgba(0,0,0,0.08);

            --color-sit-1: #22c55e;
            --color-sit-mid: #eab308;
            --color-sit-5: #ef4444;
        }

        body.dark-mode {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-label: #cbd5e1;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --tab-inactive: #334155;
            --tab-inactive-text: #94a3b8;
            --box-bg: #0f172a;
            --item-bg: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #1d4ed8;
            --shadow: rgba(0,0,0,0.4);
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg-body); 
            color: var(--text-main);
            margin: 0; 
            padding: 12px; 
            transition: background 0.2s ease, color 0.2s ease;
        }

        .container { max-width: 650px; margin: 10px auto; }
        .top-bar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
        .btn-theme {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 5px var(--shadow);
            width: auto;
            margin: 0;
        }

        .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 8px; }
        .tab-btn { 
            padding: 10px 4px; 
            border: none; 
            background: var(--tab-inactive); 
            color: var(--tab-inactive-text); 
            font-weight: bold; 
            font-size: 13px; 
            border-radius: 6px 6px 0 0; 
            cursor: pointer; 
            text-align: center; 
        }
        .tab-btn.active { 
            background: var(--bg-card); 
            color: var(--primary); 
            border-top: 3px solid var(--primary); 
        }

        .card { 
            background: var(--bg-card); 
            padding: 22px; 
            border-radius: 0 0 10px 10px; 
            box-shadow: 0 4px 15px var(--shadow); 
        }

        h2 { margin-top: 0; color: var(--text-main); font-size: 19px; text-align: center; }
        label { display: block; margin-top: 14px; font-weight: 600; color: var(--text-label); font-size: 13px; }

        input, select, button { 
            width: 100%; 
            padding: 11px; 
            margin-top: 5px; 
            border-radius: 6px; 
            border: 1px solid var(--border-color); 
            background: var(--bg-card);
            color: var(--text-main);
            box-sizing: border-box; 
            font-size: 15px; 
        }

        .btn-submit { 
            background: var(--primary); 
            color: white; 
            border: none; 
            font-weight: bold; 
            margin-top: 18px; 
            cursor: pointer; 
        }
        .btn-submit:hover { background: var(--primary-hover); }

        .btn-sm { padding: 8px 14px; font-size: 12px; font-weight: bold; border-radius: 4px; border: none; cursor: pointer; width: auto; margin: 0; }
        .btn-copy { background: #475569; color: white; }
        .btn-copy:hover { background: #334155; }
        .btn-arca { background: #0d9488; color: white; text-decoration: none; display: inline-block; padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; margin-top: 8px; }

        .badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 13px; font-weight: bold; }
        .badge-sit-1 { background-color: var(--color-sit-1); color: #064e3b; font-weight: 800; }
        .badge-sit-mid { background-color: var(--color-sit-mid); color: #713f12; font-weight: 800; }
        .badge-sit-5 { background-color: var(--color-sit-5); color: #ffffff; font-weight: 800; }

        .counter-badge { float: right; font-size: 13px; color: var(--text-muted); font-weight: bold; }
        .card-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .box-result { margin-top: 15px; padding: 14px; border-radius: 8px; background: var(--box-bg); border: 1px solid var(--border-color); }

        /* Estados de Validación para Movi */
        .movi-status-box { padding: 12px; border-radius: 6px; margin-bottom: 12px; text-align: center; font-weight: bold; font-size: 14px; }
        .movi-rechazada { background: #fee2e2; border: 2px solid #ef4444; color: #991b1b; }
        .movi-aprobada { background: #dcfce7; border: 2px solid #22c55e; color: #166534; }
        .movi-alerta { background: #fef9c3; border: 2px solid #eab308; color: #854d0e; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <button class="btn-theme" onclick="toggleTheme()" id="theme-toggle">🌙 Modo Oscuro</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="btn-t1" onclick="verTab('tab-cuit')">👤 DNI / BCRA</button>
        <button class="tab-btn" id="btn-t2" onclick="verTab('tab-geo')">📍 Mapa Cobertura</button>
        <button class="tab-btn" id="btn-t3" onclick="verTab('tab-nollame')">🚫 No Llame</button>
        <button class="tab-btn" id="btn-t4" onclick="verTab('tab-tarjeta')">💳 Tarjetas</button>
    </div>

    <!-- 1. DNI / CUIT / BCRA -->
    <div id="tab-cuit" class="card">
        <h2>Consulta DNI / CUIT / Situación BCRA</h2>
        <label>Contraseña de acceso:</label>
        <input type="password" id="password" value="tarde" placeholder="Ingresa contraseña">

        <label>Número de DNI:</label>
        <input type="number" id="dni" placeholder="Ej: 45140633">

        <label>Género a consultar:</label>
        <select id="genero">
            <option value="AMBOS">Consultar ambos (M y F)</option>
            <option value="M">Masculino (Prefijo 20)</option>
            <option value="F">Femenino (Prefijo 27)</option>
        </select>

        <button class="btn-submit" onclick="consultarPersona()">Consultar Datos</button>
        <div id="out-persona"></div>
    </div>

    <!-- 2. MAPA DE GOOGLE INTERACTIVO CON COORDENADAS -->
    <div id="tab-geo" class="card" style="display:none;">
        <h2>Buscar Cobertura en Google Maps</h2>
        <label>Dirección y localidad (o entrecalle):</label>
        <div style="display:flex; gap:8px; margin-top:5px;">
            <input type="text" id="dir-input" placeholder="Ej: Calle el volcan 2241, Las Heras o El volcan y tunuyan" style="margin-top:0;">
            <button class="btn-sm" style="background:var(--primary); color:white; padding:0 16px;" onclick="buscarEnGoogleMaps()">Buscar</button>
        </div>

        <div id="box-coords" style="display:none; margin-top:12px; background:var(--box-bg); padding:10px; border-radius:6px; border:1px solid var(--border-color);">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div>
                    <span style="font-size:12px; color:var(--text-muted); font-weight:bold;">COORDENADAS:</span><br>
                    <span id="coords-val" style="font-family:monospace; font-size:16px; font-weight:bold; color:var(--primary);">-</span>
                </div>
                <button class="btn-sm btn-copy" onclick="copiarCoords()">Copiar Coords</button>
            </div>
        </div>

        <div style="width: 100%; height: 450px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); margin-top: 12px; background: white;">
            <iframe id="mapa-frame" src="https://maps.google.com/maps?q=Las%20Heras,%20Mendoza&t=&z=14&ie=UTF8&iwloc=&output=embed" style="width: 100%; height: 100%; border: none;"></iframe>
        </div>
        <div style="display:flex; justify-content:space-between; margin-top:10px;">
            <button class="btn-sm btn-copy" onclick="copiarDireccion()">Copiar Dirección</button>
            <a id="link-maps-externo" href="https://www.google.com/maps" target="_blank" style="font-size:13px; color:var(--primary); font-weight:bold; text-decoration:none; padding:8px 0;">Abrir en app de Maps ↗</a>
        </div>
    </div>

    <!-- 3. REGISTRO NO LLAME -->
    <div id="tab-nollame" class="card" style="display:none; padding: 12px;">
        <div style="width: 100%; height: 500px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); background: white;">
            <iframe id="frame-nollame" src="https://nollame.damatec.com.ar/" style="width: 100%; height: 100%; border: none;"></iframe>
        </div>
    </div>

    <!-- 4. VALIDADOR DE TARJETAS (CON REGLAS MOVI Y NARANJA X) -->
    <div id="tab-tarjeta" class="card" style="display:none;">
        <h2>Validador de Tarjetas (Filtro Call Movi)</h2>
        <label>Número de Tarjeta: <span id="contador-digitos" class="counter-badge">0 dígitos</span></label>
        <input type="text" id="num-tarjeta" placeholder="Pega los dígitos aquí..." maxlength="23" oninput="analizarTarjeta()">

        <div class="box-result">
            <!-- Estado en Sistema Movi -->
            <div id="movi-alert" class="movi-status-box movi-alerta" style="display:none;"></div>

            <div class="card-row"><span><strong>Cantidad de Dígitos:</strong></span><span id="card-len">0</span></div>
            <div class="card-row"><span><strong>Red / Franquicia:</strong></span><span id="card-brand" style="font-weight:bold;">-</span></div>
            <div class="card-row"><span><strong>Tipo:</strong></span><span id="card-type">-</span></div>
            <div class="card-row"><span><strong>Banco / Entidad:</strong></span><span id="card-bank" style="font-weight:bold; color:var(--primary);">-</span></div>
            <div class="card-row"><span><strong>Naranja X:</strong></span><span id="card-naranja" style="font-weight:bold;">-</span></div>
            <div class="card-row"><span><strong>País:</strong></span><span id="card-country">-</span></div>
            <div class="card-row" style="border-top:1px solid var(--border-color); padding-top:8px;">
                <span><strong>Validación Luhn (Matemática):</strong></span><span id="card-luhn" style="font-weight:bold;">-</span>
            </div>
        </div>
    </div>
</div>

<script>
// Manejo de Modo Oscuro
function toggleTheme() {
    const isDark = document.body.classList.toggle('dark-mode');
    const btn = document.getElementById('theme-toggle');
    if (isDark) {
        btn.innerHTML = '☀️ Modo Claro';
        localStorage.setItem('theme', 'dark');
    } else {
        btn.innerHTML = '🌙 Modo Oscuro';
        localStorage.setItem('theme', 'light');
    }
}
if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark-mode');
    document.getElementById('theme-toggle').innerHTML = '☀️ Modo Claro';
}

function verTab(id) {
    ['tab-cuit', 'tab-geo', 'tab-nollame', 'tab-tarjeta'].forEach(t => document.getElementById(t).style.display = 'none');
    ['btn-t1', 'btn-t2', 'btn-t3', 'btn-t4'].forEach(b => document.getElementById(b).classList.remove('active'));
    document.getElementById(id).style.display = 'block';

    if (id === 'tab-cuit') document.getElementById('btn-t1').classList.add('active');
    if (id === 'tab-geo') document.getElementById('btn-t2').classList.add('active');
    if (id === 'tab-nollame') document.getElementById('btn-t3').classList.add('active');
    if (id === 'tab-tarjeta') document.getElementById('btn-t4').classList.add('active');
}

function copiar(t) {
    navigator.clipboard.writeText(t);
    alert('Copiado: ' + t);
}

// Situaciones con los colores exactos
function getSituacionInfo(sit) {
    const s = parseInt(sit, 10) || 1;
    if (s === 1) {
        return { texto: 'Situación 1 (Normal / Al día)', clase: 'badge-sit-1' };
    } else if (s >= 2 && s <= 4) {
        let det = s === 2 ? 'Riesgo Bajo (Mora 31-90 días)' : (s === 3 ? 'Riesgo Medio (Mora 91-180 días)' : 'Alto Riesgo (> 180 días)');
        return { texto: `Situación ${s} - ${det}`, clase: 'badge-sit-mid' };
    } else if (s >= 5) {
        return { texto: 'Situación 5 - Irrecuperable / Incobrable', clase: 'badge-sit-5' };
    }
    return { texto: `Situación ${sit}`, clase: 'badge-sit-1' };
}

// Respaldo de conexión local desde tu navegador en Argentina
async function clienteFetchBCRA(cuit) {
    const urlDirecta = `https://api.bcra.gob.ar/centraldedeudores/v1.0/Deudas/${cuit}`;
    const urlHist = `https://api.bcra.gob.ar/centraldedeudores/v1.0/Deudas/Historicas/${cuit}`;

    async function req(url) {
        try {
            const r = await fetch(url);
            if (r.ok) return await r.json();
        } catch (e) {
            try {
                const proxy = `https://corsproxy.io/?${encodeURIComponent(url)}`;
                const rp = await fetch(proxy);
                if (rp.ok) return await rp.json();
            } catch (err) {}
        }
        return null;
    }

    let d = await req(urlDirecta);
    let deudas = [];
    let denominacion = null;

    if (d && d.results) {
        denominacion = d.results.denominacion || null;
        if (d.results.periodos) {
            d.results.periodos.forEach(p => {
                const ents = p.entidades || p.deudas || [];
                ents.forEach(ent => {
                    deudas.push({
                        entidad: ent.entidad || ent.denominacion,
                        periodo: p.periodo,
                        monto: ent.monto,
                        situacion: ent.situacion
                    });
                });
            });
        }
    }

    if (deudas.length === 0 || !denominacion) {
        const dh = await req(urlHist);
        if (dh && dh.results) {
            denominacion = dh.results.denominacion || denominacion;
            if (deudas.length === 0 && dh.results.periodos && dh.results.periodos.length > 0) {
                const ult = dh.results.periodos[0];
                const ents = ult.entidades || ult.deudas || [];
                ents.forEach(ent => {
                    deudas.push({
                        entidad: ent.entidad || ent.denominacion,
                        periodo: ult.periodo,
                        monto: ent.monto,
                        situacion: ent.situacion
                    });
                });
            }
        }
    }

    return { denominacion, deudas };
}

// 1. Consulta DNI
async function consultarPersona() {
    const dni = document.getElementById('dni').value.trim();
    const genero = document.getElementById('genero').value;
    const password = document.getElementById('password').value.trim();
    const out = document.getElementById('out-persona');

    if (!dni || !password) return alert('Ingresa la contraseña y el DNI.');
    out.innerHTML = '<p style="text-align:center; color:var(--text-muted); margin-top:15px;">Consultando registros oficiales en Central de Deudores...</p>';

    try {
        const res = await fetch('/api/consultar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ dni, genero, password })
        });
        const data = await res.json();
        if (data.error) return out.innerHTML = `<p style="color:#e53e3e; text-align:center;">${data.error}</p>`;

        let html = '';
        for (const item of data.reportes) {
            let denominacion = item.denominacion;
            let registros = item.registros || [];

            if (!denominacion || registros.length === 0) {
                const aux = await clienteFetchBCRA(item.cuit);
                if (aux.denominacion) denominacion = aux.denominacion;
                if (aux.deudas && aux.deudas.length > 0) registros = aux.deudas;
            }

            html += `<div class="box-result">
                <div style="font-size:12px; font-weight:bold; color:var(--text-muted);">VARIANTE ${item.genero.toUpperCase()}</div>
                <div style="display:flex; justify-content:space-between; align-items:center; background:var(--bg-body); padding:6px 10px; border-radius:6px; margin:6px 0; border:1px solid var(--border-color);">
                    <span style="font-family:monospace; font-size:17px; font-weight:bold;">${item.cuit}</span>
                    <button class="btn-sm btn-copy" onclick="copiar('${item.cuit}')">Copiar CUIT</button>
                </div>
                <div style="margin: 8px 0;"><strong>Nombre / Razón Social:</strong> <span style="color:var(--primary); font-weight:bold;">${denominacion || 'No informado en BCRA'}</span></div>
                <a href="https://seti.afip.gob.ar/padron-puc-constancia-internet/ConsultaConstanciaAction.do" target="_blank" class="btn-arca" onclick="copiar('${item.cuit}')">
                    🏛️ Abrir Constancia ARCA (Copia CUIT)
                </a>
                <div style="margin-top:12px; font-weight:bold;">Situación Crediticia en BCRA:</div>`;

            if (registros && registros.length > 0) {
                registros.forEach(d => {
                    const sitInfo = getSituacionInfo(d.situacion);
                    html += `<div style="background:var(--item-bg); border:1px solid var(--border-color); padding:10px; border-radius:6px; margin-top:6px;">
                        <div style="font-weight:bold; font-size:14px;">${d.entidad}</div>
                        <div style="font-size:13px; margin: 3px 0;">Monto: <strong>$${d.monto} mil pesos</strong> | Período: ${d.periodo}</div>
                        <div style="margin-top:4px;"><span class="badge ${sitInfo.clase}">${sitInfo.texto}</span></div>
                    </div>`;
                });
            } else {
                html += `<p style="color:var(--text-muted); font-size:13px; margin:5px 0;"><em>Sin deudas comerciales ni bancarias registradas en la Central de Deudores del BCRA.</em></p>`;
            }
            html += `</div>`;
        }
        out.innerHTML = html;
    } catch (e) {
        out.innerHTML = '<p style="color:#e53e3e; text-align:center;">Error al comunicarse con el servidor.</p>';
    }
}

// 2. Google Maps y Coordenadas
let ultimasCoords = '';
async function buscarEnGoogleMaps() {
    const input = document.getElementById('dir-input').value.trim();
    if (!input) return alert('Escribe una dirección o entrecalle.');

    const query = encodeURIComponent(`${input}, Mendoza, Argentina`);
    document.getElementById('mapa-frame').src = `https://maps.google.com/maps?q=${query}&t=&z=16&ie=UTF8&iwloc=&output=embed`;
    document.getElementById('link-maps-externo').href = `https://www.google.com/maps/search/?api=1&query=${query}`;

    try {
        const res = await fetch(`/api/coords?q=${encodeURIComponent(input)}`);
        const data = await res.json();
        if (data.lat && data.lon) {
            ultimasCoords = `${data.lat}, ${data.lon}`;
            document.getElementById('coords-val').innerText = ultimasCoords;
            document.getElementById('box-coords').style.display = 'block';
        } else {
            document.getElementById('box-coords').style.display = 'none';
        }
    } catch (e) {
        document.getElementById('box-coords').style.display = 'none';
    }
}

function copiarCoords() {
    if (!ultimasCoords) return;
    copiar(ultimasCoords);
}

function copiarDireccion() {
    const d = document.getElementById('dir-input').value.trim();
    if (!d) return alert('Escribe una dirección primero.');
    copiar(d);
}

// 3. Validador de Tarjetas con Filtros de Movi y Naranja X
function luhnCheck(num) {
    let sum = 0, alt = false;
    for (let i = num.length - 1; i >= 0; i--) {
        let n = parseInt(num[i]);
        if (alt) { n *= 2; if (n > 9) n -= 9; }
        sum += n; alt = !alt;
    }
    return sum % 10 === 0;
}

function identificarMarca(n) {
    if (/^4/.test(n)) return 'VISA';
    if (/^(5[1-5]|2[2-7])/.test(n)) return 'Mastercard';
    if (/^3[47]/.test(n)) return 'American Express';
    if (/^(5896|5895|5078)/.test(n)) return 'Tarjeta Naranja Propia';
    if (/^(6042|6043)/.test(n)) return 'Cabal';
    return 'Desconocida';
}

// Evaluación de Medios Inválidos según la hoja de Movi
function evaluarReglasMovi(clean) {
    // 1. Inválidas directas
    if (/^(60|65|63)/.test(clean)) return { status: 'RECHAZADA', msg: '⛔ RECHAZADA: Comienza con 60, 65 o 63 (No la toma T3 / Cabal Débito)' };
    if (/^5258|^5577/.test(clean)) return { status: 'RECHAZADA', msg: '⛔ RECHAZADA: Tarjeta UALÁ (Entidad digital no aceptada)' };
    if (/^5547/.test(clean)) return { status: 'RECHAZADA', msg: '⛔ RECHAZADA: MERCADO PAGO (Entidad digital no aceptada)' };
    if (/^5010/.test(clean)) return { status: 'RECHAZADA', msg: '⛔ RECHAZADA: MAESTRO (5010 no permitida)' };
    if (/^4111/.test(clean)) return { status: 'RECHAZADA', msg: '⛔ RECHAZADA: BRUBANK (Entidad digital)' };
    if (/^5381/.test(clean)) return { status: 'RECHAZADA', msg: '⛔ RECHAZADA: Tarjeta Carrefour no aceptada' };
    if (/^4040/.test(clean)) return { status: 'RECHAZADA', msg: '⛔ RECHAZADA: LEMON CASH (Entidad digital)' };
    if (/^4278/.test(clean)) return { status: 'RECHAZADA', msg: '⛔ RECHAZADA: PERSONAL PAY' };
    if (/^4348/.test(clean)) return { status: 'RECHAZADA', msg: '⛔ RECHAZADA: Iniciadas con 4348 no permitidas' };
    if (/^5255/.test(clean)) return { status: 'RECHAZADA', msg: '⛔ RECHAZADA: Banco PREX' };
    if (/^5226/.test(clean)) return { status: 'RECHAZADA', msg: '⛔ RECHAZADA: 5226 (No la toma T3)' };
    if (/^5427/.test(clean)) return { status: 'RECHAZADA', msg: '⛔ RECHAZADA: 5427 (No la toma T3)' };
    if (/^4870/.test(clean)) return { status: 'RECHAZADA', msg: '⛔ RECHAZADA: 4870 (No la toma T3)' };
    if (/^4697/.test(clean)) return { status: 'RECHAZADA', msg: '⛔ RECHAZADA: 4697 (No la toma T3)' };
    if (/^5552/.test(clean)) return { status: 'RECHAZADA', msg: '⛔ RECHAZADA: 5552 (No la toma T3)' };
    if (/^5412/.test(clean)) return { status: 'RECHAZADA', msg: '⛔ RECHAZADA: 5412 (No la toma T3)' };
    if (/^4549/.test(clean)) return { status: 'RECHAZADA', msg: '⛔ RECHAZADA: BANCO SOL' };
    if (/^5591/.test(clean)) return { status: 'RECHAZADA', msg: '⛔ RECHAZADA: CENCOPLAY' };

    // 2. Alertas especiales
    if (/^4576/.test(clean)) return { status: 'ALERTA', msg: '⚠️ ATENCIÓN: 4576 - Requiere EFECTIVO SÍ' };

    return null;
}

// Detección específica de Naranja X
function detectarNaranjaX(clean, bankName) {
    const bName = (bankName || '').toUpperCase();
    if (/^(5895|5896|5078)/.test(clean)) {
        return { esNaranja: true, tipo: 'Tarjeta Naranja Propia (Crédito)' };
    }
    if (/^(4509|4508|4023)/.test(clean) || bName.includes('TARJETA NARANJA') || bName.includes('NARANJA X')) {
        return { esNaranja: true, tipo: 'Naranja X (Visa / Débito o Crédito)' };
    }
    if (/^(5344|5431)/.test(clean) && (bName.includes('NARANJA') || bName.includes('TARJETA NARANJA'))) {
        return { esNaranja: true, tipo: 'Naranja X (Mastercard Prepaga / Débito)' };
    }
    if (bName.includes('NARANJA')) {
        return { esNaranja: true, tipo: 'Naranja X' };
    }
    return { esNaranja: false, tipo: 'No' };
}

let timeoutBin;
function analizarTarjeta() {
    const clean = document.getElementById('num-tarjeta').value.replace(/\D/g, '');
    document.getElementById('contador-digitos').innerText = `${clean.length} dígitos`;
    document.getElementById('card-len').innerText = clean.length;

    const alertBox = document.getElementById('movi-alert');

    if (!clean.length) {
        alertBox.style.display = 'none';
        document.getElementById('card-brand').innerText = '-';
        document.getElementById('card-type').innerText = '-';
        document.getElementById('card-bank').innerText = '-';
        document.getElementById('card-naranja').innerText = '-';
        document.getElementById('card-country').innerText = '-';
        document.getElementById('card-luhn').innerText = '-';
        return;
    }

    // Marca
    document.getElementById('card-brand').innerText = identificarMarca(clean);

    // Validación de la hoja de Movi
    const reglaMovi = evaluarReglasMovi(clean);
    if (reglaMovi) {
        alertBox.style.display = 'block';
        alertBox.className = 'movi-status-box ' + (reglaMovi.status === 'RECHAZADA' ? 'movi-rechazada' : 'movi-alerta');
        alertBox.innerText = reglaMovi.msg;
    } else if (clean.length >= 6) {
        alertBox.style.display = 'block';
        alertBox.className = 'movi-status-box movi-aprobada';
        alertBox.innerText = '✅ PRE-APROBADA: Bin habilitado en sistema Movi';
    } else {
        alertBox.style.display = 'none';
    }

    // Detección previa Naranja X
    const checkNaranja = detectarNaranjaX(clean, '');
    if (checkNaranja.esNaranja) {
        document.getElementById('card-naranja').innerHTML = `<span style="color:#ea580c; font-weight:800;">🍊 SÍ: ${checkNaranja.tipo}</span>`;
    } else {
        document.getElementById('card-naranja').innerText = 'No';
    }

    // Algoritmo Luhn
    if (clean.length >= 13) {
        document.getElementById('card-luhn').innerHTML = luhnCheck(clean) 
            ? '<span style="color:#22c55e; font-weight:bold;">✅ VÁLIDA</span>' 
            : '<span style="color:#ef4444; font-weight:bold;">❌ INVÁLIDA (Dígito erróneo)</span>';
    } else {
        document.getElementById('card-luhn').innerText = 'Incompleta...';
    }

    // Consulta BIN internacional
    if (clean.length >= 6) {
        clearTimeout(timeoutBin);
        timeoutBin = setTimeout(async () => {
            try {
                const res = await fetch(`/api/bin/${clean.substring(0, 8)}`);
                const d = await res.json();
                if (d.valido) {
                    document.getElementById('card-bank').innerText = d.banco;
                    document.getElementById('card-type').innerText = d.tipo;
                    document.getElementById('card-country').innerText = d.pais;

                    // Re-chequeo Naranja X con el banco devuelto
                    const naranjaFinal = detectarNaranjaX(clean, d.banco);
                    if (naranjaFinal.esNaranja) {
                        document.getElementById('card-naranja').innerHTML = `<span style="color:#ea580c; font-weight:800;">🍊 SÍ: ${naranjaFinal.tipo}</span>`;
                    }

                    // Chequeo si la entidad devuelta es digital
                    const bUpper = (d.banco || '').toUpperCase();
                    if (bUpper.includes('BRUBANK') || bUpper.includes('SOL') || bUpper.includes('PREX') || bUpper.includes('LEMON') || bUpper.includes('UALA') || bUpper.includes('MERCADO')) {
                        alertBox.style.display = 'block';
                        alertBox.className = 'movi-status-box movi-rechazada';
                        alertBox.innerText = `⛔ RECHAZADA: ${d.banco} es una entidad digital no permitida`;
                    }
                }
            } catch (e) {}
        }, 400);
    }
}
