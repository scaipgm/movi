<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta DNI & BCRA</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #eef2f7; margin: 0; padding: 20px; }
        .card { max-width: 500px; margin: 20px auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { margin-top: 0; color: #1a202c; text-align: center; }
        label { display: block; margin-top: 15px; font-weight: 600; color: #4a5568; }
        input, select, button { width: 100%; padding: 12px; margin-top: 6px; border-radius: 6px; border: 1px solid #cbd5e0; box-sizing: border-box; font-size: 15px; }
        button { background: #2b6cb0; color: white; border: none; font-weight: 600; margin-top: 20px; cursor: pointer; }
        button:hover { background: #2c5282; }
        .resultado { margin-top: 15px; padding: 15px; border-radius: 6px; background: #f7fafc; border: 1px solid #e2e8f0; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 13px; font-weight: bold; }
        .sit-1 { background: #c6f6d5; color: #22543d; }
        .sit-mas { background: #fed7d7; color: #742a2a; }
    </style>
</head>
<body>

<div class="card">
    <h2>Consulta DNI / CUIT</h2>
    
    <label>Contraseña de acceso:</label>
    <input type="password" id="password" placeholder="Ingresa tu clave privada">

    <label>Número de DNI:</label>
    <input type="number" id="dni" placeholder="Ej: 35123456">

    <label>Género:</label>
    <select id="genero">
        <option value="AMBOS">Consultar ambos (M y F)</option>
        <option value="M">Masculino</option>
        <option value="F">Femenino</option>
    </select>

    <button onclick="consultar()">Consultar</button>

    <div id="output"></div>
</div>

<script>
async function consultar() {
    const dni = document.getElementById('dni').value.trim();
    const genero = document.getElementById('genero').value;
    const password = document.getElementById('password').value.trim();
    const output = document.getElementById('output');

    if (!dni || !password) {
        alert('Debes ingresar la clave y un DNI válido.');
        return;
    }

    output.innerHTML = '<p style="text-align:center; color:#718096;">Consultando...</p>';

    try {
        const res = await fetch('/api/consultar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ dni, genero, password })
        });

        const data = await res.json();
        if (data.error) {
            output.innerHTML = `<p style="color:#e53e3e; font-weight:bold;">${data.error}</p>`;
            return;
        }

        let html = '';
        data.reportes.forEach(item => {
            html += `<div class="resultado">
                <p><strong>Variante:</strong> ${item.genero}</p>
                <p><strong>CUIT:</strong> <span style="font-family:monospace; font-size:16px;">${item.cuit}</span></p>`;

            if (item.datosBCRA && item.datosBCRA.deudas && item.datosBCRA.deudas.length > 0) {
                html += `<p><strong>Nombre / Razón Social:</strong> ${item.datosBCRA.denominacion || 'N/A'}</p>`;
                html += `<p><strong>Periodo:</strong> ${item.datosBCRA.periodo || 'N/A'}</p>`;
                html += `<div style="margin-top:8px;"><strong>Deudas informadas:</strong></div><ul style="padding-left:20px;">`;
                item.datosBCRA.deudas.forEach(d => {
                    const cls = d.situacion === 1 ? 'sit-1' : 'sit-mas';
                    html += `<li>${d.entidad}: <strong>$${d.monto} mil</strong> (<span class="badge ${cls}">Sit. ${d.situacion}</span>)</li>`;
                });
                html += `</ul>`;
            } else {
                html += `<p style="color:#718096; margin: 5px 0;"><em>${item.nota || 'Sin deuda informada en el BCRA'}</em></p>`;
            }
            html += `</div>`;
        });

        output.innerHTML = html;
    } catch (e) {
        output.innerHTML = '<p style="color:#e53e3e;">Error al procesar la solicitud.</p>';
    }
}
</script>

</body>
</html>
