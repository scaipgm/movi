<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta DNI - ARCA & BCRA</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #eef2f7; margin: 0; padding: 15px; }
        .card { max-width: 580px; margin: 20px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { margin-top: 0; color: #1a202c; text-align: center; }
        label { display: block; margin-top: 15px; font-weight: 600; color: #4a5568; font-size: 14px; }
        input, select, button { width: 100%; padding: 12px; margin-top: 6px; border-radius: 6px; border: 1px solid #cbd5e0; box-sizing: border-box; font-size: 15px; }
        button.btn-main { background: #2b6cb0; color: white; border: none; font-weight: 600; margin-top: 20px; cursor: pointer; }
        button.btn-main:hover { background: #2c5282; }

        .resultado { margin-top: 20px; padding: 18px; border-radius: 10px; background: #f8fafc; border: 1px solid #e2e8f0; }
        .header-persona { border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 12px; }
        .nombre { font-size: 18px; font-weight: bold; color: #1a365d; margin-top: 4px; }
        .cuit { font-family: monospace; font-size: 16px; font-weight: bold; color: #4a5568; }

        .seccion-box { background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-top: 12px; }
        .seccion-titulo { font-size: 13px; font-weight: bold; text-transform: uppercase; color: #718096; margin-bottom: 8px; }

        .badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 13px; font-weight: bold; }
        .sit-1 { background: #c6f6d5; color: #22543d; }
        .sit-2 { background: #fefcbf; color: #744210; }
        .sit-3 { background: #feebc8; color: #7b341e; }
        .sit-4 { background: #fed7d7; color: #742a2a; }
        .sit-5 { background: #e2e8f0; color: #1a202c; border: 1px solid #a0aec0; }
        
        .arca-mono { background: #e6fffa; color: #234e52; border: 1px solid #b2f5ea; }
        .arca-inactivo { background: #edf2f7; color: #4a5568; }
        .arca-ri { background: #ebf8ff; color: #2b6cb0; border: 1px solid #bee3f8; }

        .item-deuda { background: #f8fafc; border: 1px solid #edf2f7; padding: 10px; border-radius: 6px; margin-top: 8px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Consulta DNI Integral</h2>
    
    <label>Contraseña de acceso:</label>
    <input type="password" id="password" placeholder="Ingresa tu clave privada">

    <label>Número de DNI:</label>
    <input type="number" id="dni" placeholder="Ej: 45140633">

    <label>Género a consultar:</label>
    <select id="genero">
        <option value="AMBOS">Consultar ambos (Masculino y Femenino)</option>
        <option value="M">Masculino (Prefijo 20)</option>
        <option value="F">Femenino (Prefijo 27)</option>
    </select>

    <button class="btn-main" onclick="consultar()">Consultar Datos</button>

    <div id="output"></div>
</div>

<script>
function getSituacionLabel(sit) {
    switch (parseInt(sit)) {
        case 1: return { texto: 'Situación 1 (Normal / Al día)', clase: 'sit-1' };
        case 2: return { texto: 'Situación 2 (Riesgo Bajo / Mora 31-90 días)', clase: 'sit-2' };
        case 3: return { texto: 'Situación 3 (Riesgo Medio / Mora 91-180 días)', clase: 'sit-3' };
        case 4: return { texto: 'Situación 4 (Alto Riesgo / Mora > 180 días)', clase: 'sit-4' };
        case 5: return { texto: 'Situación 5 (Irrecuperable / Incobrable)', clase: 'sit-5' };
        default: return { texto: `Situación ${sit}`, clase: 'sit-1' };
    }
}

async function consultar() {
    const dni = document.getElementById('dni').value.trim();
    const genero = document.getElementById('genero').value;
    const password = document.getElementById('password').value.trim();
    const output = document.getElementById('output');

    if (!dni || !password) {
        alert('Por favor ingresa la contraseña y el DNI.');
        return;
    }

    output.innerHTML = '<p style="text-align:center; color:#718096; margin-top:20px;">Consultando ARCA y Banco Central...</p>';

    try {
        const res = await fetch('/api/consultar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ dni, genero, password })
        });

        const data = await res.json();
        if (data.error) {
            output.innerHTML = `<p style="color:#e53e3e; font-weight:bold; margin-top:15px; text-align:center;">${data.error}</p>`;
            return;
        }

        let html = '';
        data.reportes.forEach(item => {
            let badgeArca = 'arca-inactivo';
            let textoArca = item.arca.tipo || 'No registra impuestos activos';
            if (item.arca.tipo === 'Monotributo') {
                badgeArca = 'arca-mono';
                if (item.arca.categoria) textoArca += ` (${item.arca.categoria})`;
            } else if (item.arca.tipo === 'Responsable Inscripto') {
                badgeArca = 'arca-ri';
            }

            html += `<div class="resultado">
                <div class="header-persona">
                    <div style="font-size:12px; color:#718096; font-weight:bold; text-transform:uppercase;">Variante ${item.genero}</div>
                    <div class="nombre">${item.nombre}</div>
                    <div class="cuit">CUIT: ${item.cuit}</div>
                </div>

                <div class="seccion-box">
                    <div class="seccion-titulo">🏛️ Estado en ARCA (ex-AFIP)</div>
                    <div><span class="badge ${badgeArca}">${textoArca}</span></div>
                </div>

                <div class="seccion-box">
                    <div class="seccion-titulo">🏦 Situación en Banco Central (BCRA)</div>`;

            if (item.bcra.registros && item.bcra.registros.length > 0) {
                item.bcra.registros.forEach(d => {
                    const infoSit = getSituacionLabel(d.situacion);
                    html += `<div class="item-deuda">
                        <div style="font-weight:bold; color:#1a202c;">${d.entidad}</div>
                        <div style="font-size:13px; margin: 3px 0;">Monto informado: <strong>$${d.monto} mil</strong> | Período: ${d.periodo}</div>
                        <div><span class="badge ${infoSit.clase}">${infoSit.texto}</span></div>
                    </div>`;
                });
            } else {
                html += `<p style="color:#718096; margin: 5px 0; font-size:14px;"><em>Sin deudas registradas en la Central de Deudores del BCRA.</em></p>`;
            }

            html += `</div></div>`;
        });

        output.innerHTML = html;
    } catch (e) {
        output.innerHTML = '<p style="color:#e53e3e; margin-top:15px; text-align:center;">Error al comunicarse con el servidor.</p>';
    }
}
</script>

</body>
</html>
